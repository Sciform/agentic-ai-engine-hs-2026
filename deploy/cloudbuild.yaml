# =============================================================================
# Cloud Build pipeline — builds the app container, pushes it to Artifact
# Registry (europe-west3), deploys a new revision to Cloud Run, and allows
# public (unauthenticated) access to the service.
# =============================================================================
#
# Trigger manually:
#   gcloud builds submit --region=europe-west3 --config deploy/cloudbuild.yaml .
#
# Or set up a trigger via the Console / Terraform so every push to main runs
# this pipeline automatically.
#
# Prerequisites (one-time, per project): see "1.3 One-time setup" in
# deploy/README.md. It runs scripts/setup_iam.sh (APIs + IAM roles for the
# Cloud Build and Cloud Run service accounts) and creates the Artifact
# Registry repository that step 2 pushes to.

# ----------------------------------------------------------------------------
# Substitutions
#
# User-defined variables (prefixed with `_`) are interpolated as ${_NAME}.
# Built-in variables (no prefix) come from Cloud Build itself:
#   - ${PROJECT_ID}  → the GCP project running the build
#   - ${BUILD_ID}    → UUID of this build (always populated)
#   - ${SHORT_SHA}   → first 7 chars of the commit SHA — ONLY set when the
#                      build is triggered from a git source. It is EMPTY for
#                      manual `gcloud builds submit` runs, which is why we
#                      tag images with ${BUILD_ID} instead.
# ----------------------------------------------------------------------------
substitutions:
  _REGION: europe-west3
  # Artifact Registry Docker repository in ${_REGION}.
  _REPOSITORY: agentic-ai-engineering
  # The image repository name. We do NOT include ${PROJECT_ID} here because
  # Cloud Build does not recursively expand built-in substitutions inside
  # other substitution values (without `options.dynamic_substitutions: true`).
  # Instead, ${PROJECT_ID} is referenced directly in each step / image entry.
  _IMAGE_NAME: agentic-ai-engineering


# ----------------------------------------------------------------------------
# Steps run sequentially in their own container.
# Each step's `name` is the builder image; `args` are passed to its entrypoint.
# ----------------------------------------------------------------------------
steps:
  # ── 1. Build the app image ────────────────────────────────────────────────
  # Tags it twice: with the immutable BUILD_ID (for traceability/rollback)
  # and with `latest` (for convenience). BUILD_ID is always available;
  # SHORT_SHA is only set when triggered from a git source.
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:latest"
      - "-f"
      - "deploy/Dockerfile"
      - "."

  # ── 2. Push both tags to Artifact Registry ──────────────────────────────
  # `--all-tags` pushes every tag of the named repository in one network call.
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "--all-tags"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}"

  # ── 3. Deploy a new Cloud Run revision ────────────────────────────────────
  # `service.yaml` is templated with `PROJECT_ID` and `:latest` placeholders;
  # we substitute the real values here so the revision is pinned to the exact
  # image built in step 1 (immutable, reproducible rollouts).
  #
  # Note the doubled `$$` below: Cloud Build first interpolates its own
  # ${...} substitutions in this string, then bash receives literal `$VAR`
  # references and expands them at runtime. We use `$PROJECT_ID` and
  # `$BUILD_ID` from the env block to avoid double-expansion issues.
  - name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    env:
      - "PROJECT_ID=${PROJECT_ID}"
      - "BUILD_ID=${BUILD_ID}"
      - "REGION=${_REGION}"
    args:
      - "-c"
      - |
        set -euo pipefail
        sed -e "s|PROJECT_ID|$$PROJECT_ID|g" \
            -e "s|:latest|:$$BUILD_ID|g" \
            deploy/service.yaml > /tmp/service.yaml
        gcloud run services replace /tmp/service.yaml \
          --region "$$REGION"

  # ── 4. Allow public access ────────────────────────────────────────────────
  # Cloud Run requires IAM authentication by default and answers 403
  # Forbidden otherwise. Granting `allUsers` the invoker role makes the chat
  # UI reachable without login. Anyone with the URL can then use the agents
  # (and your Gemini quota). The binding is idempotent, so re-running it on
  # every deploy is harmless. Delete this step to keep the service private.
  # Requires roles/run.admin for the Cloud Build service account (see above).
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      - "run"
      - "services"
      - "add-iam-policy-binding"
      - "agentic-ai-engineering"
      - "--region=${_REGION}"
      - "--member=allUsers"
      - "--role=roles/run.invoker"

# ----------------------------------------------------------------------------
# Declared output images.
# Listing them under `images:` makes Cloud Build record digests in the build
# metadata and (re-)push them on success. Required for Binary Authorization
# and for the build summary in the Cloud Console.
# ----------------------------------------------------------------------------
images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${BUILD_ID}"
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:latest"
