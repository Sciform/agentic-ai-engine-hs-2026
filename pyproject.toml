[project]
name = "agentic-ai-engineering"
version = "0.1.0"
description = "Agentic AI Engineering"
readme = "README.md"
requires-python = "==3.15.2"
authors = [
    {name = "Ursula", email = "ursula.maria.mayer@sciform.com"}
]
license = {text = "MIT"}

dependencies = [
    "google-auth>=2.50.0",
    "google-adk[otel]>=2.14.1",
    "google-cloud-agentplatform[agent-engines]>=2.9.0,<3",
    "google-cloud-storage>=3.10.1",
    "google-genai>=2.34.0,<3",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "structlog>=25.0.0",
    "fpdf2>=2.8.0",
    "a2a-sdk>=0.3.4,<0.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
]

# Local-only dependencies. `uv sync` installs the dev group by default, so the
# test tools and the ADK eval tools are always available locally. The Cloud Run
# image is built with `uv sync --no-dev`, and `pip install .` ignores dependency
# groups, so neither ships them.
[dependency-groups]
dev = [
    "google-adk[eval,otel]>=2.14.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
    "ruff>=0.6.0",
    "pre-commit>=4.0.0",
]

[tool.black]
line-length = 100
target-version = ["py315"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.15"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=app --cov-report=html"

[tool.setuptools.packages.find]
where = ["app", "scripts", "tests"]
